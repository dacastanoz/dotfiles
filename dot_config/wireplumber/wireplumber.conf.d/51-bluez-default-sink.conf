# Prefer Bluetooth audio outputs over the built-in speakers when they are
# connected, so headphones become the default sink automatically.
# WirePlumber 0.5 still honours a sink the user explicitly selected before.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2500
        priority.driver = 2500
      }
    }
  }
]
