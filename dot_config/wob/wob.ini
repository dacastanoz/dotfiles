# Volume/brightness bar. Same look as the xob default style it replaces: a white
# bar on the right edge, red above 100 %, shown for 2170 ms (xob -t 2170).
timeout = 2170
max = 100
anchor = right
margin = 48
orientation = vertical
width = 44
height = 324
border_offset = 4
border_size = 3
bar_padding = 3
overflow_mode = nowrap
border_color = FFFFFFFF
background_color = 00000090
bar_color = FFFFFFFF
overflow_border_color = FF0000FF
overflow_background_color = 00000090
overflow_bar_color = FF0000FF
