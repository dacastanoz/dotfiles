# /etc/battery-care.conf - read by /usr/local/bin/battery-care (key=value, not sourced)
# 1 = firmware health mode: stop charging at 80 % (Acer, acer-wmi-battery driver)
HEALTH_MODE=1
# 1 = power-saver on battery, back to the last AC choice when plugged in
AUTO_PROFILE=1
BATTERY_PROFILE=power-saver
# AC profile used until a choice has been recorded (/var/lib/battery-care/ac-profile)
AC_PROFILE=balanced
