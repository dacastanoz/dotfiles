# Hardware watchdog (sp5100_tco): PID 1 pings it; if the whole system freezes for 30 s the
# chipset resets the machine. RebootWatchdogSec bounds a hung reboot/shutdown.
# Disarmed around suspend by watchdog-suspend.service. To disable: delete this file + daemon-reexec.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
