# Freeze resilience (T18, 2026-09-29). Overrides cachyos 70-cachyos-settings.conf (nmi_watchdog=0).
# Magic SysRq: 244 = 4 (keyboard unraw) + 16 (sync) + 32 (remount ro) + 64 (signal processes: E/I)
# + 128 (reboot/poweroff). Enough for the safe REISUB sequence (Alt+SysRq+R,E,I,S,U,B);
# memory/task dumps and debug keys stay disabled.
kernel.sysrq = 244
# Reboot 10 s after a kernel panic instead of freezing forever.
kernel.panic = 10
# Lockup detectors: soft lockup (CPU stuck in kernel >20 s) and hard lockup (NMI/perf based) -> panic -> reboot.
kernel.watchdog = 1
kernel.nmi_watchdog = 1
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
# Hung tasks (usually slow/stuck I/O) must NOT reboot the machine.
kernel.hung_task_panic = 0
